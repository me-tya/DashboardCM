<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tim Pusmantap — data langsung dari Dashboard CM</title><style>*{box-sizing:border-box}
:root{--navy:#132C5D;--navy2:#27477E;--gold:#D1A42E;--ink:#1B2C4C;--muted:#63728B;--line:#DCE3EF;--bg:#F5F7FB}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 "Segoe UI",system-ui,Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tp-live{padding:12px;max-width:none;margin:0}.tp-status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 10px;color:#344867;font-size:12px}.tp-status .tp-online{color:#13A977}.tp-status .tp-badge{margin-left:auto;border:1px solid #D7E5F7;color:#244A83;border-radius:16px;padding:3px 9px;background:#EEF5FF;font-weight:650}
.tp-nav{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;border-bottom:1px solid var(--line);padding:3px 0 9px}.tp-nav button{min-width:0;padding:11px 4px;border:1px solid transparent;border-radius:9px;background:transparent;color:#536580;font-weight:650;white-space:nowrap}.tp-nav button:hover{background:#EAF0FA;color:var(--navy)}.tp-nav button.on{background:#DFEAFB;color:var(--navy);border-color:#BDCEE9;box-shadow:inset 0 -2px var(--navy)}
.tp-section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:13px 0 12px}.tp-section-head h2{font-size:19px;color:var(--navy);line-height:1.2;margin:0 0 3px;font-weight:750}.tp-section-head p{margin:0;color:var(--muted);font-size:12px}.tp-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tp-btn{border:1px solid #C7D3E4;background:white;border-radius:8px;padding:7px 12px;color:var(--navy);font-weight:650;white-space:nowrap}.tp-btn:hover{background:#EDF3FF;border-color:#7494C8}.tp-btn.primary{background:var(--navy);border-color:var(--navy);color:white}.tp-btn.primary:hover{background:#254780}
.tp-toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:end;margin-bottom:11px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:10px}
.tp-toolbar label{font-size:11px;color:#65728B;font-weight:650;display:flex;flex-direction:column;gap:3px}.tp-toolbar input,.tp-toolbar select{border:1px solid var(--line);border-radius:7px;padding:6px 9px;color:#2F4668;background:#fff;min-width:130px}.tp-toolbar .tp-search{flex:1}.tp-toolbar .tp-search input{width:100%;min-width:180px}
.tp-card{background:#fff;border:1px solid var(--line);border-radius:11px;min-width:0;overflow:hidden;box-shadow:0 1px 3px rgba(20,43,80,.03)}.tp-cardhead{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:10px 13px}.tp-cardhead h3{font-size:13px;color:var(--navy);margin:0;font-weight:750}.tp-cardhead>span{font-size:11px;color:var(--muted)}
.tp-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;margin:10px 0 12px}.tp-kpi{background:linear-gradient(135deg,#fff,#F0F4FC);text-align:left;border:1px solid #D5DFED;border-radius:10px;padding:13px 15px;color:var(--navy)}.tp-kpi:hover{border-color:#819DCD;transform:translateY(-1px)}.tp-kpi span{display:block;color:#60708B;font-weight:650;font-size:11px}.tp-kpi strong{font-size:27px;display:block;line-height:1.3;margin-top:5px}
.tp-two{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:12px;margin:10px 0}.tp-empty{padding:18px 14px;color:#718099;font-size:12px}.tp-muted{color:#718099}.tp-note{margin:10px 12px;padding:10px 11px;border-radius:7px;border:1px solid #C8D6E9;color:#344B6C;background:#F3F7FF;font-size:12px}.tp-note.warning{border-color:#EDC783;background:#FFF7E6;color:#865F13}
.tp-table-wrap{max-width:100%;overflow:auto}.tp-table{border-collapse:collapse;width:100%;table-layout:auto;font-size:12px}.tp-table th{text-align:left;color:#526789;font-size:11px;font-weight:700;background:#F5F8FD;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}.tp-table td{border-bottom:1px solid #EEF1F6;padding:9px 12px;vertical-align:middle}.tp-table tbody tr:hover{background:#F9FBFF}.tp-table td strong{display:block;color:var(--ink);font-weight:700}.tp-table td small{display:block;color:#8A95A7;font-size:11px;margin-top:3px}
.tp-link{border:0;background:none;color:#2C5594;font-size:12px;padding:4px 3px;font-weight:700;white-space:nowrap}.tp-link:hover{text-decoration:underline}.tp-link.danger{color:#B93737}
.tp-pill{display:inline-block;border-radius:20px;padding:4px 9px;white-space:nowrap;font-weight:700;font-size:11px}.tp-pill.blue{background:#E7EFFF;color:#315FB0}.tp-pill.green{background:#E4F5EB;color:#208252}.tp-pill.red{background:#FBE9E9;color:#BC4848}.tp-pill.orange{background:#FCF0E0;color:#B66B24}.tp-pill.gray{background:#EEF0F5;color:#68778C}
.tp-compact-kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:11px}.tp-compact-kpi>div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:#647590;font-size:12px}.tp-compact-kpi strong{float:right;font-size:17px;color:var(--navy)}
.tp-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;padding:12px}.tp-weekday{text-align:center;color:#637490;font-size:11px;padding:5px}.tp-dayblank{min-height:52px}.tp-day{border:1px solid #E6EBF4;background:#fff;border-radius:7px;min-height:54px;text-align:left;padding:7px;display:flex;flex-direction:column;justify-content:space-between}.tp-day:hover{border-color:#759ACB}.tp-day small{color:#8B97AB;font-size:10px}.tp-day.busy{background:#E8F1FF;border-color:#C3D8F5}.tp-day.busy small{color:#2F5B99}.tp-day.over{background:#FFF0ED;border-color:#F2C1B7}.tp-day.chosen{outline:2px solid var(--gold)}
.tp-hint{font-size:11px;color:#71829D;padding:8px 12px}.tp-leave-list{max-height:420px;overflow:auto}.tp-leave-row{padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #EDF1F6}.tp-leave-row strong,.tp-leave-row small{display:block}.tp-leave-row small{font-size:11px;color:#72819A;margin-top:3px}
.tp-team-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.tp-person{padding:9px 12px;border-bottom:1px solid #EEF1F6;display:flex;align-items:center;gap:9px}.tp-person>div{flex:1;min-width:0}.tp-person strong,.tp-person small{display:block;overflow:hidden;text-overflow:ellipsis}.tp-person small{color:#71809B;font-size:11px;margin-top:2px}.tp-avatar{width:31px;height:31px;background:#DFE8F8;color:#254C8A;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:750;flex:none}.tp-unit-people{display:flex;gap:5px;flex-wrap:wrap;padding:12px}.tp-chip{font-size:11px;border-radius:16px;background:#EEF3FD;color:#315C97;padding:4px 9px}
.tp-shade{position:fixed;inset:0;background:rgba(14,30,57,.46);z-index:1000;display:grid;place-items:center;padding:15px}.tp-dialog{width:min(470px,100%);background:white;border-radius:12px;box-shadow:0 24px 60px rgba(4,17,40,.3);overflow:hidden}.tp-dialog header{padding:13px 16px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between}.tp-dialog h3{margin:0;font-size:15px}.tp-dialog header button{background:none;color:white;font-size:22px;border:0}.tp-fields{padding:15px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tp-field{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:650;color:#5D6B83}.tp-field input,.tp-field select{min-width:0;width:100%;border:1px solid #CAD4E4;border-radius:7px;padding:9px 8px;background:white;color:var(--ink)}.tp-dialog footer{padding:11px 15px;display:flex;justify-content:end;gap:8px;border-top:1px solid #E9EEF5}.tp-dialog footer button:not(.tp-btn){background:#fff;border:1px solid #D5DFE9;border-radius:7px;padding:7px 12px}
#tpToast{position:fixed;right:20px;bottom:20px;border-radius:9px;padding:10px 17px;color:#fff;z-index:1200;opacity:0;pointer-events:none;transition:opacity .2s;font-size:12px;box-shadow:0 9px 25px #0002}#tpToast.on{opacity:1}
@media(max-width:1200px){.tp-nav{grid-template-columns:repeat(4,minmax(0,1fr))}.tp-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.tp-team-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.tp-two,.tp-team-grid{grid-template-columns:1fr}.tp-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.tp-nav{grid-template-columns:repeat(2,minmax(0,1fr))}.tp-compact-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}.tp-fields{grid-template-columns:1fr}}</style></head><body><div id="app"><div class="tp-empty">Menghubungkan ke data Dashboard CM…</div></div><div id="dialog"></div><div id="tpToast" role="status"></div><script>(function(){
'use strict';
const SRC='dcm-tim-pusmantap',ZONE='Asia/Jakarta';
let data=null,tab='highlight',filterDate='',query='',selectedTeam='ALL',month='',modal=null,pending=new Map(),seq=0;
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const str=x=>String(x==null?'':x).trim(),norm=x=>str(x).toLocaleLowerCase('id-ID');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dt=x=>new Date(str(x).slice(0,10)+'T12:00:00');
const nice=x=>x?dt(x).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'—';
const days=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const TEAM=['DCS','DOA','SPP','SSB','CM'], LEAVES=['Cuti Tahunan','Cuti Sakit','Cuti Karena Alasan Penting','Cuti Besar','Cuti Melahirkan','Cuti di Luar Tanggungan Negara'];
const cap=t=>TEAM.includes(t)?t:'Belum ditetapkan';
const edit=()=>!!data?.canEdit;
const today=()=>data?.today||iso(new Date());
const send=(type,extra)=>window.parent.postMessage(Object.assign({source:SRC,type},extra||{}),location.origin);
const toast=(msg,bad)=>{const x=$('#tpToast');x.textContent=msg;x.style.background=bad?'#8E2828':'#122B56';x.classList.add('on');clearTimeout(x._);x._=setTimeout(()=>x.classList.remove('on'),3000)};
function staff(){
 if(!data)return[];
 const base=(data.resources||[]).map(r=>({name:r.name,job:r.job,unit:r.unit,jenis:r.jenis||'Pegawai',wfhDays:r.wfhDays||[],leavePlans:r.leavePlans||[],source:'cm-team',id:r.id,role:r.role,original:r}));
 for(const m of data.manual?.members||[]){if(!base.some(r=>norm(r.name)===norm(m.name)))base.push({...m,source:'manual',wfhDays:[],leavePlans:[]})}
 return base.filter(x=>str(x.name)).map(x=>({...x,team:data.manual?.teams?.[x.name]||(x.source==='cm-team'?'CM':'')})).sort((a,b)=>TEAM.indexOf(a.team)-TEAM.indexOf(b.team)||a.name.localeCompare(b.name,'id'));
}
function leaves(){
 const a=[];for(const p of staff()){
  if(p.source==='cm-team'){
   (p.leavePlans||[]).forEach(r=>a.push({id:r.id,name:p.name,mulai:r.mulai,selesai:r.selesai,jenis:r.jenis,catatan:r.catatan||'',source:'cm-team'}));
   if(p.original.status==='Cuti'&&p.original.statusMulai){a.push({id:'status-'+p.id,name:p.name,mulai:p.original.statusMulai,selesai:p.original.statusSelesai||p.original.statusMulai,jenis:p.original.jenisCuti||'Cuti',source:'status'})}
  }
 }
 for(const x of data.manual?.leaves||[])a.push({...x,source:'manual'});
 return a.filter(x=>x.mulai&&x.selesai);
}
function actOn(day){return(data?.activities||[]).filter(a=>a.date<=day&&(a.end||a.date)>=day)}
function peopleOf(a){
 const raw=[a.people,a.pic].filter(Boolean).join(',');
 return [...new Set(raw.split(/[;,\n]+/).map(str).filter(Boolean))];
}
function associated(a,name){
 const p=peopleOf(a),needle=norm(name);
 return p.some(v=>norm(v)===needle||norm(v).split(/\s+/)[0]===needle.split(/\s+/)[0]&&v.split(/\s+/).length===1);
}
function leaveOf(p,day){return leaves().find(x=>norm(x.name)===norm(p.name)&&x.mulai<=day&&day<=x.selesai)}
function status(p,day){
 const cuti=leaveOf(p,day);if(cuti)return {tag:'Cuti',extra:cuti.jenis,cls:'red'};
 const activities=actOn(day).filter(a=>associated(a,p.name));
 const trip=activities.find(a=>str(a.assignment));
 if(trip)return{tag:'Dinas luar / ST',extra:trip.title,cls:'orange'};
 const forced=data.manual?.attendance?.[p.name+'|'+day];
 if(forced?.status)return{tag:forced.status,extra:forced.note||'',cls:forced.status==='WFH'?'blue':forced.status==='Dinas luar'?'orange':'green',manual:true};
 const weekday=dt(day).getDay();
 if(weekday===0||weekday===6)return{tag:'Libur',cls:'gray'};
 const wfh=(p.wfhDays||[]).some(x=>+x===weekday);
 return {tag:wfh?'WFH':'WFO',cls:wfh?'blue':'green',extra:activities.length?activities.length+' aktivitas':'Jadwal kehadiran'};
}
function badge(s){return '<span class="tp-pill '+esc(s.cls||'gray')+'">'+esc(s.tag)+'</span>'}
function people(scope){return staff().filter(p=>scope==='ALL'||p.team===scope||(scope==='NONE'&&!p.team))}
function scopeSelect(){return '<select id="tpTeam">'+[['ALL','Semua tim'],...TEAM.map(x=>[x,'Tim '+x]),['NONE','Belum punya tim']].map(x=>'<option value="'+x[0]+'" '+(selectedTeam===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select>'}
function titleBar(title,desc,action){return '<div class="tp-section-head"><div><h2>'+esc(title)+'</h2><p>'+esc(desc)+'</p></div><div class="tp-actions">'+(action||'')+'</div></div>'}
function btn(label,action,main){return '<button class="tp-btn '+(main?'primary':'')+'" data-act="'+action+'">'+label+'</button>'}
function openAct(a){send('goto-activity',{id:a?.id||''})}
function activityRows(items){
 return items.length?'<div class="tp-table-wrap"><table class="tp-table"><thead><tr><th style="width:90px">Tanggal</th><th style="width:110px">Waktu</th><th>Kegiatan</th><th style="width:15%">Unit</th><th style="width:22%">PIC / Peserta</th><th style="width:82px">Aksi</th></tr></thead><tbody>'+
 items.map(a=>'<tr><td>'+esc(nice(a.date))+'</td><td>'+esc(a.time||'—')+'</td><td><strong>'+esc(a.title)+'</strong><small>'+esc(a.location||a.category||'')+'</small></td><td>'+esc(a.unit||'—')+'</td><td>'+esc(a.people||a.pic||'Belum tercatat')+'</td><td><button class="tp-link" data-open="'+esc(a.id)+'">Detail / CRUD</button></td></tr>').join('')+'</tbody></table></div>':
 '<div class="tp-empty">Tidak ada aktivitas yang tercatat untuk periode atau filter ini. Tambahkan melalui menu Aktivitas.</div>';
}
function highlight(){
 const date=today(),all=staff(),acts=actOn(date),onLeave=all.filter(p=>status(p,date).tag==='Cuti'),remote=all.filter(p=>status(p,date).tag==='WFH'),trip=all.filter(p=>status(p,date).tag==='Dinas luar / ST'),attention=watch(date);
 const tiles=[['Pegawai aktif',all.length,''],['Agenda hari ini',acts.length,'agenda'],['Cuti hari ini',onLeave.length,'cuti'],['WFH hari ini',remote.length,'hadir'],['Dinas luar / ST',trip.length,'hadir'],['Perlu perhatian',attention.length,'perhatian']];
 const cards='<div class="tp-kpis">'+tiles.map(x=>'<button class="tp-kpi" data-view="'+(x[2]==='perhatian'?'cuti':x[2]||'profil')+'"><span>'+esc(x[0])+'</span><strong>'+x[1]+'</strong></button>').join('')+'</div>';
 return titleBar('Ringkasan otomatis','Dihitung dari Aktivitas, data CM Team, dan pengelolaan manual yang tersimpan.')+cards+
 '<div class="tp-two"><section class="tp-card"><div class="tp-cardhead"><h3>Agenda hari ini</h3><button class="tp-link" data-view="agenda">Lihat semua</button></div>'+activityRows(acts.slice().sort((a,b)=>a.time.localeCompare(b.time)).slice(0,6))+'</section>'+
 '<section class="tp-card"><div class="tp-cardhead"><h3>Perlu perhatian</h3><span>'+attention.length+' hal</span></div>'+(attention.length?attention.map(x=>'<div class="tp-note warning">'+esc(x)+'</div>').join(''):'<div class="tp-empty">Tidak ada hal yang memerlukan perhatian.</div>')+'</section></div>';
}
function watch(d){
 const l=leaves(),list=staff(),out=[],max=Math.floor(list.length*.5);
 const count=list.filter(p=>leaveOf(p,d)).length;
 if(count>max)out.push('Cuti seluruh Pusmantap '+count+' orang, kuota '+max+' orang. Perlu penyesuaian jadwal.');
 for(const t of TEAM){const ps=list.filter(p=>p.team===t),n=ps.filter(p=>leaveOf(p,d)).length,limit=Math.floor(ps.length*.5);if(n>limit)out.push('Tim '+t+': '+n+' orang cuti, kuota '+limit+' orang.')}
 const missing=list.filter(p=>!p.team);if(missing.length)out.push(missing.length+' pegawai belum mempunyai penempatan tim.');
 return out;
}
function agenda(){
 const list=(data.activities||[]).filter(a=>a.date<=filterDate&&(a.end||a.date)>=filterDate)
 .filter(a=>selectedTeam==='ALL'||peopleOf(a).some(n=>people(selectedTeam).some(p=>norm(p.name)===norm(n))))
 .filter(a=>(a.title+' '+a.unit+' '+a.people+' '+a.pic).toLowerCase().includes(query.toLowerCase()))
 .sort((a,b)=>str(a.time).localeCompare(str(b.time)));
 return titleBar('Agenda dari Aktivitas','Menampilkan aktivitas nyata pada tanggal yang dipilih. Tambah, ubah, dan hapus melalui formulir Aktivitas yang sama.',
 btn('＋ Tambah Aktivitas','add-activity',true))+
 '<div class="tp-toolbar"><label>Tanggal <input id="tpDate" type="date" value="'+esc(filterDate)+'"></label><label>Tim '+scopeSelect()+'</label><label class="tp-search">Cari <input id="tpQuery" placeholder="Nama kegiatan, PIC, unit…" value="'+esc(query)+'"></label></div>'+
 '<section class="tp-card">'+activityRows(list)+'</section>';
}
function attendance(){
 const ps=people(selectedTeam).filter(p=>p.name.toLowerCase().includes(query.toLowerCase()));
 const counts={WFO:0,WFH:0,Cuti:0,'Dinas luar / ST':0};
 ps.forEach(p=>{let s=status(p,filterDate).tag;if(counts[s]!=null)counts[s]++});
 return titleBar('Kehadiran dan ketersediaan','Status cuti dan ST diambil otomatis; jadwal WFH mengikuti profil pegawai. Koreksi harian dapat dilakukan manual.')+
 '<div class="tp-toolbar"><label>Tanggal <input id="tpDate" type="date" value="'+esc(filterDate)+'"></label><label>Tim '+scopeSelect()+'</label><label class="tp-search">Cari <input id="tpQuery" placeholder="Cari pegawai…" value="'+esc(query)+'"></label></div>'+
 '<div class="tp-compact-kpi">'+Object.entries(counts).map(x=>'<div>'+esc(x[0])+' <strong>'+x[1]+'</strong></div>').join('')+'</div>'+
 '<section class="tp-card"><div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Pegawai</th><th>Tim</th><th>Status</th><th>Keterangan</th><th style="width:120px">Manual</th></tr></thead><tbody>'+
 ps.map(p=>{const s=status(p,filterDate);return '<tr><td><strong>'+esc(p.name)+'</strong><small>'+esc(p.job||'')+'</small></td><td>'+esc(cap(p.team))+'</td><td>'+badge(s)+'</td><td>'+esc(s.extra||'—')+'</td><td>'+(edit()?'<button class="tp-link" data-att="'+esc(p.name)+'">Atur / Reset</button>':'—')+'</td></tr>'}).join('')+
 '</tbody></table></div>'+(!ps.length?'<div class="tp-empty">Belum ada data pegawai.</div>':'')+'</section>';
}
function leave(){
 const rows=leaves().filter(x=>!query||(x.name+' '+x.jenis).toLowerCase().includes(query.toLowerCase()))
 .sort((a,b)=>a.mulai.localeCompare(b.mulai));
 const year=+month.slice(0,4),mo=+month.slice(5,7),count=new Date(year,mo,0).getDate(),off=(new Date(year,mo-1,1).getDay()+6)%7;
 const cells=Array.from({length:off},()=>'<span class="tp-dayblank"></span>');
 for(let i=1;i<=count;i++){
  const d=month+'-'+String(i).padStart(2,'0'),cnt=staff().filter(p=>leaveOf(p,d)).length;
  const limit=Math.floor(staff().length*.5);
  cells.push('<button class="tp-day '+(cnt>limit?'over':cnt?'busy':'')+(d===filterDate?' chosen':'')+'" data-day="'+d+'"><b>'+i+'</b><small>'+cnt+' cuti</small></button>');
 }
 const period=rows.filter(x=>x.selesai>=month+'-01'&&x.mulai<=month+'-31');
 return titleBar('Cuti Pusmantap','Rencana yang tersimpan langsung dihitung. Batas kuota dibulatkan ke bawah (50% pegawai aktif), termasuk pegawai sementara dan tanpa tim.',edit()?btn('＋ Tambah Cuti','add-leave',true):'')+
 '<div class="tp-toolbar"><label>Bulan <input id="tpMonth" type="month" value="'+esc(month)+'"></label><label>Tim '+scopeSelect()+'</label><label class="tp-search">Cari <input id="tpQuery" placeholder="Cari pegawai / jenis cuti" value="'+esc(query)+'"></label></div>'+

function render(){
 if(!data){$('#app').innerHTML='<div class="tp-empty">Menghubungkan ke data Dashboard CM…</div>';return;}

 const view={highlight,agenda,hadir:attendance,cuti:leave,tempat:placement,profil:profile,sementara:temporary,unit}[tab]||highlight;
 $('#app').innerHTML='<div class="tp-live"><div class="tp-status"><span class="tp-online">●</span><b>Data langsung dari Dashboard CM</b><span>Aktivitas + CM Team • '+esc(nice(today()))+'</span><span class="tp-badge">'+(edit()?'Bisa kelola':'Lihat saja')+'</span></div>'+
 '<nav class="tp-nav">'+navigation.map(x=>'<button data-view="'+x[0]+'" class="'+(x[0]===tab?'on':'')+'">'+x[1]+'</button>').join('')+'</nav>'+
 '<main>'+view()+'</main></div>';

function go(t){tab=t;query='';selectedTeam='ALL';render()}
function mutation(action,payload){
 if(!edit())return toast('Tidak mempunyai izin mengubah data.',true);
 return new Promise((resolve,reject)=>{
  const requestId='tp-'+(++seq);
  pending.set(requestId,{resolve,reject});
  send('mutation',{requestId,action,data:payload});
  setTimeout(()=>{if(pending.has(requestId)){pending.delete(requestId);reject(new Error('Tidak ada respons penyimpanan dari Dashboard CM'))}},20000);
 });
}
function close(){modal=null;$('#dialog').innerHTML=''}
function formField(label,name,type,val,options){
 const o=options||[];
 return '<label class="tp-field"><span>'+esc(label)+'</span>'+(type==='select'?'<select name="'+name+'">'+o.map(x=>'<option value="'+esc(x)+'" '+(str(val)===x?'selected':'')+'>'+esc(x||'Belum ditetapkan')+'</option>').join('')+'</select>':'<input name="'+name+'" type="'+type+'" value="'+esc(val||'')+'" '+(name==='name'?'required':'')+'>')+'</label>';
}
function popup(title,kind,content,extra){
 modal={kind};$('#dialog').innerHTML='<div class="tp-shade"><section class="tp-dialog" role="dialog" aria-modal="true"><header><h3>'+esc(title)+'</h3><button data-close aria-label="Tutup">×</button></header><form id="tpForm"><div class="tp-fields">'+content+'</div><footer>'+((extra||''))+'<button type="button" data-close>Batal</button><button class="tp-btn primary" type="submit">Simpan</button></footer></form></section></div>';
 $('#dialog [data-close]').forEach?.(()=>{});
 $$('#dialog [data-close]').forEach(x=>x.onclick=close);
 $('#tpForm').onsubmit=saveForm;
}

function limitLeave(c){
 const staffAll=staff(),leaveList=leaves().filter(x=>!(c.id&&x.id===c.id&&norm(x.name)===norm(c.name))),s=dt(c.mulai),end=dt(c.selesai);
 if(!str(c.mulai)||!str(c.selesai)||!Number.isFinite(s.getTime())||!Number.isFinite(end.getTime())||end<s)return'Tanggal cuti tidak valid.';
 if(leaveList.some(x=>norm(x.name)===norm(c.name)&&x.mulai<=c.selesai&&x.selesai>=c.mulai))return'Jadwal cuti pegawai ini bertumpuk.';
 if(['Cuti Sakit','Cuti Melahirkan'].includes(c.jenis))return c.mulai>today()?'Cuti Sakit atau Cuti Melahirkan dicatat setelah terjadi, bukan dijadwalkan di masa depan.':'';
 for(let d=new Date(s);d<=end;d.setDate(d.getDate()+1)){
  if([0,6].includes(d.getDay()))continue;
  const date=iso(d),all=staffAll.filter(p=>leaveList.some(x=>norm(x.name)===norm(p.name)&&x.mulai<=date&&x.selesai>=date));
  const person=staffAll.find(p=>norm(p.name)===norm(c.name));
  const n=all.length+(all.some(p=>norm(p.name)===norm(c.name))?0:1),max=Math.floor(staffAll.length*.5);
  if(n>max)return'Kuota cuti Pusmantap tanggal '+nice(date)+' terlampaui: '+n+' dari '+max+' orang.';
  if(person?.team){
   const ps=staffAll.filter(x=>x.team===person.team);
   const occupied=ps.filter(p=>leaveList.some(x=>norm(x.name)===norm(p.name)&&x.mulai<=date&&x.selesai>=date)).length;
   const need=occupied+(ps.some(p=>norm(p.name)===norm(c.name))?1:0);
   if(need>Math.floor(ps.length*.5))return'Kuota cuti Tim '+person.team+' tanggal '+nice(date)+' terlampaui.';
  }
 }
 return'';
}
async function saveForm(e){
 e.preventDefault();
 const form=new FormData(e.target),v=Object.fromEntries(form.entries()),kind=modal.kind;
 if(kind==='leave'){
  if(!v.name)return toast('Pilih pegawai.',true);
  const err=limitLeave(v);if(err)return toast(err,true);
 }
 const act={leave:'leave-save',member:'member-save',team:'team-save',attendance:'attendance-save'}[kind];
 const submit=e.target.querySelector('button[type=submit]');submit.disabled=true;
 try{await mutation(act,v);close();toast('Data tersimpan dan disinkronkan.')}
 catch(e){toast(e.message,true);submit.disabled=false}
}

 $$('#app [data-member-edit]').forEach(x=>x.onclick=()=>openMember(staff().find(p=>p.name===x.dataset.memberEdit)));

 $$('#app [data-leave-edit]').forEach(x=>x.onclick=()=>openLeave(leaves().find(c=>c.id===x.dataset.leaveEdit&&c.name===x.dataset.leavePerson)));
 $$('#app [data-leave-del]').forEach(x=>x.onclick=async()=>{if(!confirm('Hapus periode cuti ini?'))return;try{await mutation('leave-delete',{name:x.dataset.leavePerson,id:x.dataset.leaveDel});toast('Cuti dihapus')}catch(e){toast(e.message,true)}});
 $$('#app [data-day]').forEach(x=>x.onclick=()=>{filterDate=x.dataset.day;render()});
 $('#tpDate')?.addEventListener('change',e=>{filterDate=e.target.value||today();render()});
 $('#tpMonth')?.addEventListener('change',e=>{month=e.target.value||today().slice(0,7);render()});
 $('#tpTeam')?.addEventListener('change',e=>{selectedTeam=e.target.value;render()});
 $('#tpQuery')?.addEventListener('input',e=>{query=e.target.value;const idx=e.target.selectionStart;render();const el=$('#tpQuery');if(el){el.focus();el.setSelectionRange(idx,idx)}});
}
window.addEventListener('message',ev=>{
 if(ev.origin!==location.origin||ev.source!==window.parent)return;
 const m=ev.data;if(!m||m.source!==SRC)return;
 if(m.type==='snapshot'){
  data=m;filterDate=filterDate||today();month=month||today().slice(0,7);render();
 }else if(m.type==='mutation-result'){
  const p=pending.get(m.requestId);if(!p)return;pending.delete(m.requestId);m.ok?p.resolve():p.reject(new Error(m.error||'Gagal menyimpan'));
 }
});
window.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
if(window.self!==window.top && typeof ResizeObserver==='function'){
  const observer=new ResizeObserver(()=>{
    window.parent.postMessage({source:SRC,type:'resize',height:document.documentElement.scrollHeight},location.origin);
  });
  observer.observe(document.body);
}
send('ready');
})();</script></body></html>
