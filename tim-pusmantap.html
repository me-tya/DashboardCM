<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tim Pusmantap — data langsung dari Dashboard CM</title><style id="mockup-original-css">
:root{--navy:#0E2A5C;--navy2:#1B3E7A;--navy3:#2A4F8F;--navy-l:#EAF0FA;--gold:#C9A443;--gold2:#E2C46B;--gold-l:#FBF4DF;--gold-d:#8C6B12;
--ink:#13213D;--ink2:#3A4763;--ink3:#66728C;--ink4:#9AA4BA;--line:#D9E0EC;--line2:#E9EDF4;--bg:#F2F4F8;--card:#fff;--hd:#F6F8FC;
--o:#178A4C;--o-l:#E6F5EC;--h:#2F6FCE;--h-l:#E8F0FC;--c:#D33A3A;--c-l:#FCEAEA;--s:#C25A12;--s-l:#FDF0E3;--v:#6B4FC4;--v-l:#EFEBFB;
--sh:0 1px 2px rgba(14,42,92,.05),0 2px 6px rgba(14,42,92,.05);--sh2:0 14px 38px rgba(14,42,92,.18)}
*{box-sizing:border-box}html{-webkit-font-smoothing:antialiased}
body{margin:0;font:13px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}svg.i.s{width:14px;height:14px}
.demo{position:sticky;top:0;z-index:50;background:#081B3D;color:#fff;padding:9px 24px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;border-bottom:2px solid var(--gold)}
.demo b{font-size:11px;letter-spacing:.6px;opacity:.6;font-weight:700;margin-right:6px}
.demo button{background:#13295A;border:1px solid #2C4579;color:#D5DEEF;border-radius:20px;padding:5px 12px;font-size:12px;transition:.15s}.demo button:hover{border-color:var(--gold2)}
.demo button.on{background:var(--gold);border-color:var(--gold);color:#0B1E44;font-weight:700}
.demo .who{margin-left:auto;font-size:12px;opacity:.85;display:flex;gap:6px;align-items:center}
.wrap{max-width:1440px;margin:0 auto;padding:20px 28px 48px}
.crumb{color:var(--ink3);font-size:12px}.crumb b{color:var(--ink)}
h1{font-size:23px;margin:4px 0 14px;letter-spacing:-.2px;color:var(--navy)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tab{padding:10px 14px;color:var(--ink3);font-weight:600;border-bottom:3px solid transparent;display:flex;gap:7px;align-items:center;margin-bottom:-1px}
.tab.on{color:var(--navy);border-color:var(--gold)}.tc{background:var(--navy-l);color:var(--navy);border-radius:10px;padding:0 7px;font-size:11px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.seg{display:inline-flex;background:#E9EDF4;border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}.seg button{border:0;background:none;padding:7px 13px;border-radius:8px;font-weight:600;color:var(--ink3);display:flex;gap:6px;align-items:center;transition:.15s}.seg button:hover{color:var(--navy)}
.seg button.on,.seg button.on:hover{background:var(--navy);color:#fff;box-shadow:0 2px 6px rgba(14,42,92,.25)}.seg .on svg{color:var(--gold2)}
.btn{border:1px solid #CDD6E5;background:#fff;border-radius:9px;padding:7px 12px;font-weight:600;color:var(--ink2);display:inline-flex;gap:6px;align-items:center;transition:.15s;white-space:nowrap}.btn:hover{background:#F6F8FC;border-color:#B5C1D6}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.pri:hover{background:var(--navy2)}.btn.gold{background:var(--gold);border-color:var(--gold);color:#0B1E44}.btn.gold:hover{background:var(--gold2)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}.btn.on-dark{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:#fff}.btn.on-dark:hover{background:rgba(255,255,255,.16)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:7px;border:1px solid #CDD6E5;border-radius:9px;padding:0 10px;color:var(--ink4);background:#fff}.search input{border:0;outline:0;font:inherit;padding:7px 0;width:200px;color:var(--ink)}
.chip{font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;white-space:nowrap;display:inline-flex;align-items:center;gap:3px}
.ke{background:var(--gold-l);color:var(--gold-d)}.rk{background:var(--v-l);color:var(--v)}.pm{background:var(--navy-l);color:var(--navy2)}.cm{background:var(--v-l);color:var(--v)}.pb{background:var(--s-l);color:var(--s)}.gr{background:#EEF1F6;color:var(--ink2)}.tmp{background:#FFF1DE;color:#A2560E}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;flex:none;position:relative;letter-spacing:.3px}
.av.xs{width:20px;height:20px;font-size:8.5px}.av.sm{width:26px;height:26px;font-size:10px}.av.md{width:42px;height:42px;font-size:14px}.av.lg{width:68px;height:68px;font-size:22px}
.av[data-s]:after{content:"";position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;border:2px solid #fff;background:var(--sc)}.av.lg[data-s]:after{width:15px;height:15px;border-width:3px}.av.xs:after{display:none}
.nkc{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:2px 9px 2px 7px;font-size:12px;font-weight:600;color:var(--ink2);transition:.12s}.nkc:hover{border-color:var(--navy3);color:var(--navy)}
.nkc i{width:7px;height:7px;border-radius:50%;display:inline-block}.nkc.kap{background:var(--gold-l);border-color:#EAD9A6;color:var(--gold-d)}
.badge{font-size:11px;font-weight:700;border-radius:7px;padding:2px 8px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.b-o{background:var(--o-l);color:var(--o)}.b-h{background:var(--h-l);color:var(--h)}.b-c{background:var(--c-l);color:var(--c)}.b-s{background:var(--s-l);color:var(--s)}
.muted{color:var(--ink3)}.sm{font-size:12px}.xs{font-size:11px}.warn{color:var(--c);font-weight:600}
.ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.empty{padding:22px;text-align:center;color:var(--ink4);font-size:12.5px}
.lnk{color:var(--navy2);font-weight:600;font-size:12px;display:inline-flex;gap:3px;align-items:center;background:none;border:0;padding:0;white-space:nowrap}.lnk:hover{color:var(--navy);text-decoration:underline}
/* ===== HIGHLIGHT ===== */
.band{margin:14px 16px 0;border-radius:14px;padding:16px 18px;background:linear-gradient(120deg,var(--navy) 0%,var(--navy2) 70%,#24508F 100%);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;position:relative;overflow:hidden}
.band:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.band h2{margin:0;font-size:19px;letter-spacing:-.2px}.band .sub{opacity:.75;font-size:12px;display:flex;gap:6px;align-items:center;margin-top:2px}
.sync{display:inline-flex;gap:5px;align-items:center;background:rgba(226,196,107,.16);color:var(--gold2);border:1px solid rgba(226,196,107,.35);border-radius:14px;padding:1px 8px;font-size:11px;font-weight:700}
.wgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;padding:16px;align-items:stretch}
.w{border:1px solid var(--line);border-radius:14px;background:#fff;display:flex;flex-direction:column;min-width:0;box-shadow:var(--sh)}.w.full{grid-column:1/-1}
.wh{display:flex;align-items:center;gap:9px;padding:11px 14px;background:var(--hd);border-bottom:1px solid var(--line);border-radius:14px 14px 0 0;flex-wrap:wrap}
.wh h3{margin:0;font-size:14px;font-weight:700;color:var(--navy)}.wh .sp{flex:1}.wh .ico{background:#fff;border:1px solid var(--line);color:var(--navy)}
.wb{flex:1;display:flex;flex-direction:column;min-height:0}.wf{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--line2);background:#FCFDFE;border-radius:0 0 14px 14px;font-size:12px;color:var(--ink3);min-height:42px}
.pager{display:flex;align-items:center;gap:4px}.pager b{min-width:40px;text-align:center;font-size:12px;color:var(--ink2)}
.ibtn{width:30px;height:30px;border-radius:8px;border:1px solid transparent;background:none;display:grid;place-items:center;color:var(--ink2)}.ibtn:hover:not(:disabled){background:#EEF2F8;border-color:var(--line)}.ibtn:disabled{opacity:.35;cursor:default}
.fch{display:flex;gap:4px;flex-wrap:wrap;padding:9px 14px;border-bottom:1px solid var(--line2)}
.fch button{border:1px solid #CDD6E5;background:#fff;border-radius:16px;padding:2px 10px;font-size:11.5px;font-weight:600;color:var(--ink2);display:inline-flex;gap:4px;align-items:center}.fch .on{background:var(--navy);border-color:var(--navy);color:#fff}.fch .k.on{background:var(--gold);border-color:var(--gold);color:#0B1E44}
.ag{display:grid;grid-template-columns:58px 1fr auto;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line2);cursor:pointer;transition:.12s;text-align:left;background:none;border-left:3px solid transparent;width:100%;border-top:0;border-right:0}
.ag:hover{background:#F7F9FD;border-left-color:var(--gold)}.ag:last-child{border-bottom:0}
.ag .tm{font-weight:800;font-size:12.5px;color:var(--navy);line-height:1.2}.ag .tm small{display:block;font-weight:500;color:var(--ink4)}
.ag.done .tm,.ag.done .ttl{color:var(--ink4)}.ag.now{background:#FBF8EE;border-left-color:var(--gold)}
.ag .ttl{font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.ag .meta{display:flex;gap:10px;color:var(--ink3);font-size:12px;margin:2px 0 7px;flex-wrap:wrap}.ag .meta span{display:inline-flex;gap:4px;align-items:center}
.ag .ppl{display:flex;gap:5px;flex-wrap:wrap}.ag .go{color:var(--ink4);align-self:center}
.row{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2);align-items:flex-start;cursor:pointer;background:none;border-top:0;border-right:0;border-left:3px solid transparent;width:100%;text-align:left;transition:.12s}.row:hover{background:#F7F9FD;border-left-color:var(--gold)}.row .x{flex:1;min-width:0}.row .nm{font-weight:700}
.grp{font-size:10.5px;font-weight:800;letter-spacing:.6px;color:var(--ink4);padding:9px 14px 3px;display:flex;align-items:center;gap:6px}
.backup{display:inline-flex;gap:5px;align-items:center;font-size:11.5px;background:var(--navy-l);color:var(--navy2);border-radius:7px;padding:2px 7px;margin-top:5px;font-weight:600}
.hero{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px 14px}.hero .att{grid-column:span 2}
.att{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.att .big{display:flex;align-items:baseline;gap:8px}.att .big b{font-size:26px;letter-spacing:-.5px;color:var(--navy)}.att .big span{color:var(--ink3)}
.sbar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:9px 0 8px;background:#EEF1F6;gap:2px}.sbar i{display:block;height:100%}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}.leg span{display:inline-flex;gap:5px;align-items:center}.leg i{width:9px;height:9px;border-radius:3px;display:inline-block}
.tile{border:1px solid var(--line);border-radius:12px;padding:11px 12px;text-align:left;background:#fff;display:flex;flex-direction:column;gap:6px;transition:.15s;position:relative}
.tile:hover{border-color:var(--gold);box-shadow:0 4px 14px rgba(201,164,67,.18)}.tile .r1{display:flex;justify-content:space-between;align-items:center}.tile b{font-size:22px;letter-spacing:-.4px;line-height:1;color:var(--navy)}.tile small{color:var(--ink3);font-size:12px;line-height:1.3}
.tile .go{position:absolute;right:10px;bottom:9px;color:var(--ink4)}
.addw{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 16px;margin:0 16px 16px;border:1.5px dashed #CBD4E4;border-radius:14px;background:#FAFBFD;color:var(--ink3)}
.addw button{border:1px solid #CDD6E5;background:#fff;border-radius:16px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--navy2);display:inline-flex;gap:4px;align-items:center}.addw button:hover{border-color:var(--gold)}
/* calendar */
.calh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 14px;flex-wrap:wrap;border-bottom:1px solid var(--line2)}
.mnav{display:flex;align-items:center;gap:2px}.mnav b{min-width:126px;text-align:center;font-size:14px;color:var(--navy)}
.cstat{display:flex;gap:8px;padding:9px 14px 0;flex-wrap:wrap}.cstat span{font-size:12px;border-radius:8px;padding:3px 9px;background:#F3F5FA;color:var(--ink2);display:inline-flex;gap:5px;align-items:center}.cstat .bad{background:var(--c-l);color:var(--c);font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;padding:9px 14px}
.cal .dw{font-size:11px;font-weight:700;color:var(--ink4);text-align:center}
.cd{border:1px solid var(--line2);border-radius:9px;min-height:62px;padding:5px 6px;display:flex;flex-direction:column;gap:2px;background:#fff;text-align:left;transition:.12s;min-width:0}
.cd:hover{border-color:var(--gold);box-shadow:var(--sh)}.cd .n{font-size:12px;font-weight:700;color:var(--ink2);display:flex;justify-content:space-between;align-items:center}
.cd.l1{background:#F5F1FD}.cd.l2{background:#FDF3DF;border-color:#F0DDB0}.cd.l3{background:#FDE9E9;border-color:#F2B8B8}.cd.l3 .n{color:var(--c)}
.cd.we{background:#F8F9FB;border-style:dashed}.cd.we .n{color:var(--ink4)}.cd.hol{background:repeating-linear-gradient(135deg,#F8F9FB 0 6px,#EEF1F6 6px 12px)}
.cd.out{visibility:hidden}.cd.today{box-shadow:inset 0 0 0 2px var(--navy)}.cd.sel{outline:2.5px solid var(--gold);outline-offset:1px}
.cd .nks{font-size:10px;font-weight:600;color:var(--ink2);line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cd .cnt{font-size:10.5px;font-weight:800;margin-top:auto;white-space:nowrap}.cd.l3 .cnt{color:var(--c)}.cd.l2 .cnt{color:#9A6A00}.cd.l1 .cnt{color:var(--v)}
.cd .hl{font-size:9.5px;color:var(--ink3);font-weight:600;line-height:1.2}
.cleg{display:flex;gap:10px;padding:0 14px 8px;font-size:11.5px;color:var(--ink3);flex-wrap:wrap}.cleg span{display:inline-flex;gap:5px;align-items:center}.cleg i{width:12px;height:12px;border-radius:4px;border:1px solid var(--line);display:inline-block}
.dd{margin:0 14px 12px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#FBFCFE}
.dd .t{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.dd h4{margin:0;font-size:13.5px;color:var(--navy)}
.pres{display:flex;height:8px;border-radius:5px;background:#EEF1F6;margin:9px 0 8px;position:relative}.pres i{display:block;height:100%}.pres i:first-child{border-radius:5px 0 0 5px}.pres .th{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--navy);border-radius:2px}
.msg{font-size:12px;border-radius:8px;padding:6px 9px;display:flex;gap:6px;align-items:flex-start;margin-bottom:8px}.msg.ok{background:var(--o-l);color:#11603A}.msg.bad{background:var(--c-l);color:#9B1F1F}.msg.inf{background:var(--navy-l);color:var(--navy2)}
.pl{display:flex;flex-wrap:wrap;gap:5px}
/* week grid */
.wk{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.wk th{font-size:11.5px;color:var(--ink3);font-weight:700;padding:8px 6px;text-align:center;background:#FAFBFD;border-bottom:1px solid var(--line);white-space:nowrap}.wk th:first-child,.wk td:first-child{text-align:left;padding-left:14px}
.wk td{padding:4px 5px;border-bottom:1px solid var(--line2);text-align:center;background:#fff}.wk tbody tr:hover td{background:#FAFBFE}
.wk .td{background:#FFFAEB!important}.wk th.td{color:var(--gold-d)}
.wk tfoot td{background:#FAFBFD;font-weight:700;font-size:11.5px;color:var(--ink2);border-bottom:0}
.who2{display:inline-flex;gap:8px;align-items:center;border:0;background:none;padding:0;text-align:left}.who2:hover b{color:var(--navy);text-decoration:underline}.who2 b{font-weight:700}.who2 small{display:block;color:var(--ink4);font-size:11px;font-weight:400}
.cell{width:100%;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:7px;padding:5px 2px;font-size:11px;font-weight:700;border:1px solid transparent;background:none;position:relative}
.cell.o{background:var(--o-l);color:var(--o)}.cell.h{background:var(--h-l);color:var(--h)}.cell.c{background:var(--c-l);color:var(--c)}.cell.s{background:var(--s-l);color:var(--s)}
.cell.ed{cursor:pointer}.cell.ed:hover{border-color:currentColor}.cell .m{background:var(--navy);color:#fff;border-radius:7px;font-size:9.5px;padding:0 4px;line-height:14px}
.cell.ovr:before{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 1.5px #fff}
.cpop{position:absolute;z-index:20;top:calc(100% - 2px);left:50%;transform:translateX(-50%);width:240px;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:var(--sh2);padding:8px;text-align:left}
.cpop h5{margin:2px 4px 6px;font-size:12px;color:var(--navy)}.cpop .opt{display:flex;width:100%;gap:8px;align-items:center;border:0;background:none;border-radius:7px;padding:6px 7px;font-size:12px;font-weight:600}.cpop .opt:hover{background:#F3F6FB}.cpop .opt.on{background:var(--navy-l);color:var(--navy)}
.cpop .opt i{width:10px;height:10px;border-radius:3px}.cpop input{width:100%;font:inherit;font-size:12px;border:1px solid #CDD6E5;border-radius:7px;padding:5px 7px;margin-top:6px}
.load{display:flex;align-items:center;gap:6px}.load i{display:block;width:56px;height:6px;border-radius:4px;background:#EEF1F6;overflow:hidden}.load i b{display:block;height:100%}
/* ===== board ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;padding:12px 16px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;background:#fff;text-align:left;transition:.15s}.kpi:hover{border-color:var(--gold)}.kpi b{font-size:20px;letter-spacing:-.3px;color:var(--navy)}.kpi small{color:var(--ink3);display:block;font-size:12px}
.kapus{display:flex;gap:10px;align-items:center;margin:0 16px 12px;padding:9px 12px;border:1px solid #EAD9A6;border-radius:12px;background:linear-gradient(90deg,var(--gold-l),#fff 60%);cursor:pointer;width:calc(100% - 32px);text-align:left}
.board{display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:10px;padding:0 16px 16px;overflow:auto;align-items:stretch}
.col{background:#F5F7FB;border:1px solid var(--line);border-radius:12px;padding:8px;min-height:380px;transition:.15s}.col.un{background:#FFF9EA;border:1.5px dashed #E2C77E}.col.over{border-color:var(--gold);background:#FFFBEF}
.ch{padding:4px 4px 9px;margin-bottom:8px;border-bottom:1px solid var(--line)}.ch .t{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;color:var(--navy)}
.ch .t em{font-style:normal;font-size:11px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 7px;color:var(--ink3)}.ch .m{color:var(--ink3);font-size:11.5px;margin-top:2px}.ch .bar{height:4px;border-radius:3px;margin-top:7px}
.p{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 8px;margin-bottom:6px;display:flex;gap:8px;align-items:center;position:relative;transition:.12s;cursor:pointer}.p:hover{box-shadow:var(--sh);border-color:#B9C5DA}

function staff(){
 if(!data)return[];
 const base=(data.resources||[]).map(r=>({name:r.name,job:r.job,unit:r.unit,jenis:r.jenis||'Pegawai',wfhDays:r.wfhDays||[],leavePlans:r.leavePlans||[],source:'cm-team',id:r.id,role:r.role,original:r}));
 for(const m of data.manual?.members||[]){if(!base.some(r=>norm(r.name)===norm(m.name)))base.push({...m,source:'manual',wfhDays:[],leavePlans:[]})}
 return base.filter(x=>str(x.name)).map(x=>({...x,team:data.manual?.teams?.[x.name]||(x.source==='cm-team'?'CM':'')})).sort((a,b)=>TEAM.indexOf(a.team)-TEAM.indexOf(b.team)||a.name.localeCompare(b.name,'id'));
}
function leaves(){
 const a=[];for(const p of staff()){
  if(p.source==='cm-team'){
   (p.leavePlans||[]).forEach(r=>a.push({id:r.id,name:p.name,mulai:r.mulai,selesai:r.selesai,jenis:r.jenis,catatan:r.catatan||'',source:'cm-team'}));
   if(p.original.status==='Cuti'&&p.original.statusMulai){a.push({id:'status-'+p.id,name:p.name,mulai:p.original.statusMulai,selesai:p.original.statusSelesai||p.original.statusMulai,jenis:p.original.jenisCuti||'Cuti',source:'status'})}
  }
 }
 for(const x of data.manual?.leaves||[])a.push({...x,source:'manual'});
 return a.filter(x=>x.mulai&&x.selesai);
}
function actOn(day){return(data?.activities||[]).filter(a=>a.date<=day&&(a.end||a.date)>=day)}
function peopleOf(a){
 const raw=[a.people,a.pic].filter(Boolean).join(',');
 return [...new Set(raw.split(/[;,\n]+/).map(str).filter(Boolean))];
}
function associated(a,name){
 const p=peopleOf(a),needle=norm(name);
 return p.some(v=>norm(v)===needle||norm(v).split(/\s+/)[0]===needle.split(/\s+/)[0]&&v.split(/\s+/).length===1);
}
function leaveOf(p,day){return leaves().find(x=>norm(x.name)===norm(p.name)&&x.mulai<=day&&day<=x.selesai)}
function status(p,day){
 const cuti=leaveOf(p,day);if(cuti)return {tag:'Cuti',extra:cuti.jenis,cls:'red'};
 const activities=actOn(day).filter(a=>associated(a,p.name));
 const trip=activities.find(a=>str(a.assignment));
 if(trip)return{tag:'Dinas luar / ST',extra:trip.title,cls:'orange'};
 const forced=data.manual?.attendance?.[p.name+'|'+day];
 if(forced?.status)return{tag:forced.status,extra:forced.note||'',cls:forced.status==='WFH'?'blue':forced.status==='Dinas luar'?'orange':'green',manual:true};
 const weekday=dt(day).getDay();
 if(weekday===0||weekday===6)return{tag:'Libur',cls:'gray'};
 const wfh=(p.wfhDays||[]).some(x=>+x===weekday);
 return {tag:wfh?'WFH':'WFO',cls:wfh?'blue':'green',extra:activities.length?activities.length+' aktivitas':'Jadwal kehadiran'};
}
function badge(s){return '<span class="tp-pill '+esc(s.cls||'gray')+'">'+esc(s.tag)+'</span>'}
function people(scope){return staff().filter(p=>scope==='ALL'||p.team===scope||(scope==='NONE'&&!p.team))}
function scopeSelect(){return '<select id="tpTeam">'+[['ALL','Semua tim'],...TEAM.map(x=>[x,'Tim '+x]),['NONE','Belum punya tim']].map(x=>'<option value="'+x[0]+'" '+(selectedTeam===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select>'}

function activityRows(items){
 return items.length?'<div class="tp-table-wrap"><table class="tp-table"><thead><tr><th style="width:90px">Tanggal</th><th style="width:110px">Waktu</th><th>Kegiatan</th><th style="width:15%">Unit</th><th style="width:22%">PIC / Peserta</th><th style="width:82px">Aksi</th></tr></thead><tbody>'+
 items.map(a=>'<tr><td>'+esc(nice(a.date))+'</td><td>'+esc(a.time||'—')+'</td><td><strong>'+esc(a.title)+'</strong><small>'+esc(a.location||a.category||'')+'</small></td><td>'+esc(a.unit||'—')+'</td><td>'+esc(a.people||a.pic||'Belum tercatat')+'</td><td><button class="tp-link" data-open="'+esc(a.id)+'">Detail / CRUD</button></td></tr>').join('')+'</tbody></table></div>':
 '<div class="tp-empty">Tidak ada aktivitas yang tercatat untuk periode atau filter ini. Tambahkan melalui menu Aktivitas.</div>';
}
function highlight(){
 const date=today(),all=staff(),acts=actOn(date),onLeave=all.filter(p=>status(p,date).tag==='Cuti'),remote=all.filter(p=>status(p,date).tag==='WFH'),trip=all.filter(p=>status(p,date).tag==='Dinas luar / ST'),attention=watch(date);
 const tiles=[['Pegawai aktif',all.length,''],['Agenda hari ini',acts.length,'agenda'],['Cuti hari ini',onLeave.length,'cuti'],['WFH hari ini',remote.length,'hadir'],['Dinas luar / ST',trip.length,'hadir'],['Perlu perhatian',attention.length,'perhatian']];
 const cards='<div class="tp-kpis">'+tiles.map(x=>'<button class="tp-kpi" data-view="'+(x[2]==='perhatian'?'cuti':x[2]||'profil')+'"><span>'+esc(x[0])+'</span><strong>'+x[1]+'</strong></button>').join('')+'</div>';
 return '<div class="band"><div><h2>Highlight Tim Pusmantap</h2><div class="sub">'+ic('sync','s')+' Terhubung dengan Aktivitas dan CM Team · '+esc(nice(today()))+'</div></div><div class="tools"><span class="chip ke">'+(edit()?'Kelola':'Lihat saja')+'</span></div></div>'+cards+
 '<div class="tp-two"><section class="tp-card"><div class="tp-cardhead"><h3>Agenda hari ini</h3><button class="tp-link" data-view="agenda">Lihat semua</button></div>'+activityRows(acts.slice().sort((a,b)=>a.time.localeCompare(b.time)).slice(0,6))+'</section>'+
 '<section class="tp-card"><div class="tp-cardhead"><h3>Perlu perhatian</h3><span>'+attention.length+' hal</span></div>'+(attention.length?attention.map(x=>'<div class="tp-note warning">'+esc(x)+'</div>').join(''):'<div class="tp-empty">Tidak ada hal yang memerlukan perhatian.</div>')+'</section></div>';
}
function watch(d){
 const l=leaves(),list=staff(),out=[],max=Math.floor(list.length*.5);
 const count=list.filter(p=>leaveOf(p,d)).length;
 if(count>max)out.push('Cuti seluruh Pusmantap '+count+' orang, kuota '+max+' orang. Perlu penyesuaian jadwal.');
 for(const t of TEAM){const ps=list.filter(p=>p.team===t),n=ps.filter(p=>leaveOf(p,d)).length,limit=Math.floor(ps.length*.5);if(n>limit)out.push('Tim '+t+': '+n+' orang cuti, kuota '+limit+' orang.')}
 const missing=list.filter(p=>!p.team);if(missing.length)out.push(missing.length+' pegawai belum mempunyai penempatan tim.');
 return out;
}
function agenda(){
 const list=(data.activities||[]).filter(a=>a.date<=filterDate&&(a.end||a.date)>=filterDate)
 .filter(a=>selectedTeam==='ALL'||peopleOf(a).some(n=>people(selectedTeam).some(p=>norm(p.name)===norm(n))))
 .filter(a=>(a.title+' '+a.unit+' '+a.people+' '+a.pic).toLowerCase().includes(query.toLowerCase()))
 .sort((a,b)=>str(a.time).localeCompare(str(b.time)));
 return titleBar('Agenda dari Aktivitas','Menampilkan aktivitas nyata pada tanggal yang dipilih. Tambah, ubah, dan hapus melalui formulir Aktivitas yang sama.',
 btn('＋ Tambah Aktivitas','add-activity',true))+
 '<div class="tp-toolbar"><label>Tanggal <input id="tpDate" type="date" value="'+esc(filterDate)+'"></label><label>Tim '+scopeSelect()+'</label><label class="tp-search">Cari <input id="tpQuery" placeholder="Nama kegiatan, PIC, unit…" value="'+esc(query)+'"></label></div>'+
 '<section class="tp-card">'+activityRows(list)+'</section>';
}
function attendance(){

 const counts={WFO:0,WFH:0,Cuti:0,'Dinas luar / ST':0};
 ps.forEach(p=>{let s=status(p,filterDate).tag;if(counts[s]!=null)counts[s]++});

 '<section class="tp-card"><div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Pegawai</th><th>Tim</th><th>Status</th><th>Keterangan</th><th style="width:120px">Manual</th></tr></thead><tbody>'+

 '</tbody></table></div>'+(!ps.length?'<div class="tp-empty">Belum ada data pegawai.</div>':'')+'</section>';
}
function leave(){
 const rows=leaves().filter(x=>!query||(x.name+' '+x.jenis).toLowerCase().includes(query.toLowerCase()))
 .sort((a,b)=>a.mulai.localeCompare(b.mulai));
 const year=+month.slice(0,4),mo=+month.slice(5,7),count=new Date(year,mo,0).getDate(),off=(new Date(year,mo-1,1).getDay()+6)%7;
 const cells=Array.from({length:off},()=>'<span class="tp-dayblank"></span>');
 for(let i=1;i<=count;i++){
  const d=month+'-'+String(i).padStart(2,'0'),cnt=staff().filter(p=>leaveOf(p,d)).length;
  const limit=Math.floor(staff().length*.5);
  cells.push('<button class="tp-day '+(cnt>limit?'over':cnt?'busy':'')+(d===filterDate?' chosen':'')+'" data-day="'+d+'"><b>'+i+'</b><small>'+cnt+' cuti</small></button>');
 }
 const period=rows.filter(x=>x.selesai>=month+'-01'&&x.mulai<=month+'-31');
 return titleBar('Cuti Pusmantap','Rencana yang tersimpan langsung dihitung. Batas kuota dibulatkan ke bawah (50% pegawai aktif), termasuk pegawai sementara dan tanpa tim.',edit()?btn('＋ Tambah Cuti','add-leave',true):'')+
 '<div class="tp-toolbar"><label>Bulan <input id="tpMonth" type="month" value="'+esc(month)+'"></label><label>Tim '+scopeSelect()+'</label><label class="tp-search">Cari <input id="tpQuery" placeholder="Cari pegawai / jenis cuti" value="'+esc(query)+'"></label></div>'+
 '<div class="tp-two"><section class="tp-card"><div class="tp-cardhead"><h3>Kalender cuti · '+esc(month)+'</h3><span>Dipilih: '+nice(filterDate)+'</span></div><div class="tp-calendar">'+['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(x=>'<b class="tp-weekday">'+x+'</b>').join('')+cells.join('')+'</div><div class="tp-hint">Biru: ada cuti · Merah: melampaui kuota · Pilih tanggal untuk melihat ringkasan.</div><div class="tp-note">'+staff().filter(p=>leaveOf(p,filterDate)).length+' dari '+staff().length+' pegawai sedang cuti pada '+nice(filterDate)+'. Kuota: '+Math.floor(staff().length*.5)+' orang.</div></section>'+

 '<div class="tp-leave-list">'+(period.length?period.map(x=>'<div class="tp-leave-row"><div><strong>'+esc(x.name)+'</strong><small>'+esc(x.jenis)+' · '+nice(x.mulai)+' – '+nice(x.selesai)+'</small></div>'+(edit()&&x.source!=='status'?'<div class="tp-actions"><button class="tp-link" data-leave-edit="'+esc(x.id)+'" data-leave-person="'+esc(x.name)+'">Ubah</button><button class="tp-link danger" data-leave-del="'+esc(x.id)+'" data-leave-person="'+esc(x.name)+'">Hapus</button></div>':'')+'</div>').join(''):'<div class="tp-empty">Belum ada rencana cuti untuk bulan ini.</div>')+'</div></section></div>';
}
function placement(){
 const list=staff(),un=list.filter(p=>!p.team),temp=list.filter(p=>/secondment|magang|re.entry|sementara|kontrak/i.test(p.jenis+' '+p.job));
 const colors={DCS:'#2F6FCE',DOA:'#0E8A8A',SPP:'#B5600F',SSB:'#1E8E4E',CM:'#6B4FC4'};
 const card=p=>{const st=status(p,today()),name=p.name,initials=name.split(/\s+/).slice(0,2).map(v=>v[0]).join('').toUpperCase();
  return '<div class="p tp-place-card" draggable="'+edit()+'" data-drag-name="'+esc(name)+'">'+
   '<span class="av" style="background:'+esc(colors[p.team]||'#7E889B')+'">'+esc(initials)+'</span>'+
   '<div class="x"><div class="nm">'+esc(name)+'</div><div class="sb">'+
   (p.team?'<span class="chip '+(p.team==='CM'?'cm':'pm')+'">'+esc(p.team==='CM'?'CMO':'PMO')+'</span>':'')+
   (temp.some(t=>t.name===name)?'<span class="chip tmp">'+esc(p.jenis)+'</span>':'')+
   '<span>'+esc(st.tag==='WFO'||st.tag==='WFH'?p.unit||p.job:st.tag)+'</span></div></div>'+
   (edit()?'<button class="mn" type="button" data-team-edit="'+esc(name)+'" aria-label="Atur penempatan '+esc(name)+'" title="Atur penempatan">'+ic('more','s')+'</button>':'')+'</div>'};
 const col=t=>{
  const current=t?list.filter(p=>p.team===t):un,col=t?colors[t]:'#E2C77E';
  return '<section class="col '+(t?'':'un')+'" data-drop-team="'+esc(t)+'"><div class="ch"><div class="t">'+(t?'Tim '+esc(t):'Belum ditempatkan')+' <em>'+current.length+'</em></div>'+
   '<div class="m">'+(t?(t==='CM'?'CMO':'PMO')+' · Anggota aktif':'Belum mendapatkan tim')+'</div><div class="bar" style="background:'+col+'"></div></div>'+
   (current.length?current.map(card).join(''):'<div class="empty">'+(t?'Belum ada anggota':'Semua sudah mempunyai tim')+'</div>')+'</section>';
 };
 const kpis=[
  ['users',list.length,'Pegawai aktif','var(--navy-l)','var(--navy)'],
  ['alert',un.length,'Belum punya tim','#FFF3D6','#9A6A00'],
  ['hour',temp.length,'Pegawai sementara','var(--s-l)','var(--s)'],
  ['cal',(data.activities||[]).filter(a=>a.date<=today()&&a.end>=today()).length,'Agenda hari ini','var(--v-l)','var(--v)']
 ].map(x=>'<div class="kpi"><span class="ico" style="background:'+x[3]+';color:'+x[4]+'">'+ic(x[0])+'</span><div><b>'+x[1]+'</b><small>'+esc(x[2])+'</small></div></div>').join('');
 return titleBar('Penempatan Tim','Papan penempatan mengikuti ukuran dan warna mockup asli. Anggota diambil otomatis dari CM Team; pindahkan antar kolom atau klik ⋯ untuk pengelolaan.',edit()?btn('＋ Tambah Pegawai','add-member',true):'')+
  '<div class="tp-placement"><div class="kpis">'+kpis+'</div><div class="board">'+col('')+TEAM.map(col).join('')+'</div>'+
  '<div class="foot"><div class="leg"><span><i style="background:var(--o)"></i>WFO</span><span><i style="background:var(--h)"></i>WFH</span><span><i style="background:var(--s)"></i>Dinas luar</span><span><i style="background:var(--c)"></i>Cuti</span></div>'+
  '<span>Penempatan manual tersimpan pada Dashboard CM</span></div></div>';
}
function profile(){
 const list=people(selectedTeam).filter(p=>(p.name+' '+p.job+' '+p.unit+' '+p.jenis).toLowerCase().includes(query.toLowerCase()));
 return titleBar('Profil Pegawai','Profil CM Team mengikuti master yang sudah ada. Pegawai lain dapat ditambahkan, diubah, atau dihapus di sini.',edit()?btn('＋ Tambah Pegawai','add-member',true):'')+
 '<div class="tp-toolbar"><label>Tim '+scopeSelect()+'</label><label class="tp-search">Cari <input id="tpQuery" value="'+esc(query)+'" placeholder="Nama, jabatan, unit…"></label></div>'+
 '<section class="tp-card"><div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Nama</th><th>Jabatan</th><th>Tim</th><th>Unit</th><th>Jenis</th><th>Sumber</th><th>Aksi</th></tr></thead><tbody>'+
 list.map(p=>'<tr><td><strong>'+esc(p.name)+'</strong></td><td>'+esc(p.job||'—')+'</td><td>'+esc(cap(p.team))+'</td><td>'+esc(p.unit||'—')+'</td><td>'+esc(p.jenis||'—')+'</td><td>'+esc(p.source==='cm-team'?'CM Team':'Manual')+'</td><td>'+(edit()?p.source==='cm-team'?'<button class="tp-link" data-act="open-resource">Kelola CM Team</button>':'<button class="tp-link" data-member-edit="'+esc(p.name)+'">Ubah</button> <button class="tp-link danger" data-member-del="'+esc(p.name)+'">Hapus</button>':'—')+'</td></tr>').join('')+'</tbody></table></div></section>';
}
function temporary(){
 const list=staff().filter(p=>/secondment|magang|re.entry|sementara|temporary|kontrak/i.test(p.jenis+' '+p.role+' '+p.job));
 return titleBar('Pegawai Sementara','Diambil dari jenis kepegawaian pada profil pegawai; tanpa tanggal atau nama simulasi.')+
 '<section class="tp-card">'+(list.length?'<div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Nama</th><th>Jenis</th><th>Jabatan / unit</th><th>Tim</th><th>Status hari ini</th></tr></thead><tbody>'+list.map(p=>'<tr><td><strong>'+esc(p.name)+'</strong></td><td>'+esc(p.jenis)+'</td><td>'+esc(p.job||p.unit||'—')+'</td><td>'+esc(cap(p.team))+'</td><td>'+badge(status(p,today()))+'</td></tr>').join('')+'</tbody></table></div>':'<div class="tp-empty">Belum ada pegawai dengan jenis penugasan sementara yang tercatat.</div>')+'</section>';
}
function unit(){
 const by=new Map();
 (data.activities||[]).forEach(a=>{const u=str(a.unit)||'Unit tidak tercatat';if(!by.has(u))by.set(u,{unit:u,activities:[],people:new Set()});by.get(u).activities.push(a);peopleOf(a).forEach(n=>by.get(u).people.add(n))});
 const list=[...by.values()].sort((a,b)=>b.activities.length-a.activities.length).filter(x=>(x.unit+' '+[...x.people].join(' ')).toLowerCase().includes(query.toLowerCase()));
 return titleBar('Pendampingan Unit','Jumlah kegiatan dan PIC diambil dari Aktivitas. Penempatan tim pegawai tetap dikelola manual pada tab Penempatan Tim.')+
 '<div class="tp-toolbar"><label class="tp-search">Cari unit <input id="tpQuery" placeholder="Nama unit atau PIC…" value="'+esc(query)+'"></label></div>'+
 '<div class="tp-team-grid">'+list.map(x=>'<section class="tp-card"><div class="tp-cardhead"><h3>'+esc(x.unit)+'</h3><span>'+x.activities.length+' aktivitas</span></div><div class="tp-unit-people">'+([...[...x.people].filter(Boolean)].length?[...x.people].map(n=>'<span class="tp-chip">'+esc(n)+'</span>').join(''):'<span class="tp-muted">PIC belum tercatat</span>')+'</div><div class="tp-hint">Terakhir: '+nice(x.activities.map(a=>a.date).sort().slice(-1)[0])+'</div></section>').join('')+(list.length?'':'<section class="tp-card"><div class="tp-empty">Belum ada unit pemohon dari data Aktivitas.</div></section>')+'</div>';
}
function render(){
 if(!data){$('#app').innerHTML='<div class="tp-empty">Menghubungkan ke data Dashboard CM…</div>';return;}
 const navigation=[['highlight','spark','Highlight'],['agenda','cal','Agenda'],['hadir','bld','Kehadiran'],['cuti','sun','Cuti'],['tempat','kanban','Penempatan Tim'],['profil','idc','Profil Pegawai'],['sementara','hour','Pegawai Sementara'],['unit','org','Pendampingan Unit']];
 const view={highlight,agenda,hadir:attendance,cuti:leave,tempat:placement,profil:profile,sementara:temporary,unit}[tab]||highlight;
 $('#app').innerHTML='<div class="tp-live" data-mockup-v4="restored"><div class="card"><div class="head"><nav class="seg tabs2" role="tablist" aria-label="Menu Tim Pusmantap">'+navigation.map(x=>'<button role="tab" aria-selected="'+(x[0]===tab)+'" data-view="'+x[0]+'" class="'+(x[0]===tab?'on':'')+'">'+ic(x[1],'s')+esc(x[2])+'</button>').join('')+'</nav></div>'+
 '<main class="tp-panel-body">'+view()+'</main></div></div>';
 bind();
}
function go(t){tab=t;query='';selectedTeam='ALL';render()}
function mutation(action,payload){
 if(!edit())return toast('Tidak mempunyai izin mengubah data.',true);
 return new Promise((resolve,reject)=>{
  const requestId='tp-'+(++seq);
  pending.set(requestId,{resolve,reject});
  send('mutation',{requestId,action,data:payload});
  setTimeout(()=>{if(pending.has(requestId)){pending.delete(requestId);reject(new Error('Tidak ada respons penyimpanan dari Dashboard CM'))}},20000);
 });
}
function close(){modal=null;$('#dialog').innerHTML=''}
function formField(label,name,type,val,options){
 const o=options||[];
 return '<label class="tp-field"><span>'+esc(label)+'</span>'+(type==='select'?'<select name="'+name+'">'+o.map(x=>'<option value="'+esc(x)+'" '+(str(val)===x?'selected':'')+'>'+esc(x||'Belum ditetapkan')+'</option>').join('')+'</select>':'<input name="'+name+'" type="'+type+'" value="'+esc(val||'')+'" '+(name==='name'?'required':'')+'>')+'</label>';
}
function popup(title,kind,content,extra){
 modal={kind};$('#dialog').innerHTML='<div class="tp-shade"><section class="tp-dialog" role="dialog" aria-modal="true"><header><h3>'+esc(title)+'</h3><button data-close aria-label="Tutup">×</button></header><form id="tpForm"><div class="tp-fields">'+content+'</div><footer>'+((extra||''))+'<button type="button" data-close>Batal</button><button class="tp-btn primary" type="submit">Simpan</button></footer></form></section></div>';

 $$('#dialog [data-close]').forEach(x=>x.onclick=close);
 $('#tpForm').onsubmit=saveForm;
}
function openLeave(existing){
 const c=existing||{id:'',name:'',mulai:filterDate||today(),selesai:filterDate||today(),jenis:'Cuti Tahunan',catatan:''};
 const names=staff().map(p=>p.name);
 popup(existing?'Ubah Cuti':'Tambah Cuti','leave',
 formField('Pegawai','name','select',c.name,names)+formField('Jenis cuti','jenis','select',c.jenis,LEAVES)+formField('Mulai','mulai','date',c.mulai)+formField('Selesai','selesai','date',c.selesai)+formField('Catatan (opsional)','catatan','text',c.catatan)+
 '<input name="id" type="hidden" value="'+esc(c.id||'')+'">');
}
function openMember(p){
 popup(p?'Ubah Pegawai':'Tambah Pegawai','member',
 formField('Nama lengkap','name','text',p?.name)+formField('Jabatan','job','text',p?.job)+formField('Unit kerja','unit','text',p?.unit)+
 formField('Jenis kepegawaian','jenis','select',p?.jenis||'Pegawai',['Pegawai','Secondment','Re-entry','Magang Kemnaker','Pegawai Sementara'])+
 '<input type="hidden" name="oldName" value="'+esc(p?.name||'')+'">');
}
function openTeam(p){
 popup('Penempatan Tim · '+p.name,'team',formField('Nama pegawai','name','text',p.name)+formField('Tim utama','team','select',p.team,['',...TEAM]));
 const f=$('#tpForm [name=name]');f.readOnly=true;
}
function openAttendance(p){
 const r=data.manual?.attendance?.[p.name+'|'+filterDate]||{};
 popup('Koreksi kehadiran · '+p.name,'attendance',
 formField('Pegawai','name','text',p.name)+formField('Tanggal','date','date',filterDate)+
 formField('Status','status','select',r.status||'',['','WFO','WFH','Dinas luar'])+formField('Keterangan','note','text',r.note||''));
 $('#tpForm [name=name]').readOnly=true;
}
function limitLeave(c){
 const staffAll=staff(),leaveList=leaves().filter(x=>!(c.id&&x.id===c.id&&norm(x.name)===norm(c.name))),s=dt(c.mulai),end=dt(c.selesai);
 if(!str(c.mulai)||!str(c.selesai)||!Number.isFinite(s.getTime())||!Number.isFinite(end.getTime())||end<s)return'Tanggal cuti tidak valid.';
 if(leaveList.some(x=>norm(x.name)===norm(c.name)&&x.mulai<=c.selesai&&x.selesai>=c.mulai))return'Jadwal cuti pegawai ini bertumpuk.';
 if(['Cuti Sakit','Cuti Melahirkan'].includes(c.jenis))return c.mulai>today()?'Cuti Sakit atau Cuti Melahirkan dicatat setelah terjadi, bukan dijadwalkan di masa depan.':'';
 for(let d=new Date(s);d<=end;d.setDate(d.getDate()+1)){
  if([0,6].includes(d.getDay()))continue;
  const date=iso(d),all=staffAll.filter(p=>leaveList.some(x=>norm(x.name)===norm(p.name)&&x.mulai<=date&&x.selesai>=date));
  const person=staffAll.find(p=>norm(p.name)===norm(c.name));
  const n=all.length+(all.some(p=>norm(p.name)===norm(c.name))?0:1),max=Math.floor(staffAll.length*.5);
  if(n>max)return'Kuota cuti Pusmantap tanggal '+nice(date)+' terlampaui: '+n+' dari '+max+' orang.';
  if(person?.team){
   const ps=staffAll.filter(x=>x.team===person.team);
   const occupied=ps.filter(p=>leaveList.some(x=>norm(x.name)===norm(p.name)&&x.mulai<=date&&x.selesai>=date)).length;
   const need=occupied+(ps.some(p=>norm(p.name)===norm(c.name))?1:0);
   if(need>Math.floor(ps.length*.5))return'Kuota cuti Tim '+person.team+' tanggal '+nice(date)+' terlampaui.';
  }
 }
 return'';
}
async function saveForm(e){
 e.preventDefault();
 const form=new FormData(e.target),v=Object.fromEntries(form.entries()),kind=modal.kind;
 if(kind==='leave'){
  if(!v.name)return toast('Pilih pegawai.',true);
  const err=limitLeave(v);if(err)return toast(err,true);
 }
 const act={leave:'leave-save',member:'member-save',team:'team-save',attendance:'attendance-save'}[kind];
 const submit=e.target.querySelector('button[type=submit]');submit.disabled=true;
 try{await mutation(act,v);close();toast('Data tersimpan dan disinkronkan.')}
 catch(e){toast(e.message,true);submit.disabled=false}
}
function bind(){
 $$('#app [data-view]').forEach(x=>x.onclick=()=>go(x.dataset.view));
 $$('#app [data-open]').forEach(x=>x.onclick=()=>openAct({id:x.dataset.open}));
 $$('#app [data-act]').forEach(x=>x.onclick=()=>{if(x.dataset.act==='add-activity')openAct();else if(x.dataset.act==='open-resource')send('goto-resource');else if(x.dataset.act==='add-member')openMember();else if(x.dataset.act==='add-leave')openLeave()});
 $$('#app [data-team-edit]').forEach(x=>x.onclick=()=>openTeam(staff().find(p=>p.name===x.dataset.teamEdit)));
 $$('#app [data-att]').forEach(x=>x.onclick=()=>openAttendance(staff().find(p=>p.name===x.dataset.att)));
 $$('#app [data-member-edit]').forEach(x=>x.onclick=()=>openMember(staff().find(p=>p.name===x.dataset.memberEdit)));
 $$('#app [data-member-del]').forEach(x=>x.onclick=async()=>{if(!confirm('Hapus '+x.dataset.memberDel+' dari Tim Pusmantap?'))return;try{await mutation('member-delete',{name:x.dataset.memberDel});toast('Pegawai dihapus')}catch(e){toast(e.message,true)}});
 $$('#app [data-leave-edit]').forEach(x=>x.onclick=()=>openLeave(leaves().find(c=>c.id===x.dataset.leaveEdit&&c.name===x.dataset.leavePerson)));
 $$('#app [data-leave-del]').forEach(x=>x.onclick=async()=>{if(!confirm('Hapus periode cuti ini?'))return;try{await mutation('leave-delete',{name:x.dataset.leavePerson,id:x.dataset.leaveDel});toast('Cuti dihapus')}catch(e){toast(e.message,true)}});
 $$('#app [data-day]').forEach(x=>x.onclick=()=>{filterDate=x.dataset.day;render()});

 $$('#app [data-drag-name]').forEach(el=>{if(!edit())return;el.ondragstart=e=>{e.dataTransfer.setData('text/plain',el.dataset.dragName);e.dataTransfer.effectAllowed='move'}});
 $$('#app [data-drop-team]').forEach(el=>{if(!edit())return;
   el.ondragover=e=>{e.preventDefault();el.classList.add('over');e.dataTransfer.dropEffect='move'};
   el.ondragleave=e=>{if(!el.contains(e.relatedTarget))el.classList.remove('over')};
   el.ondrop=async e=>{e.preventDefault();el.classList.remove('over');
    const name=e.dataTransfer.getData('text/plain'),team=el.dataset.dropTeam;
    if(!name||!staff().some(p=>p.name===name)||staff().find(p=>p.name===name).team===team)return;
    try{await mutation('team-save',{name,team});toast('Penempatan '+name+' berhasil diubah.')}catch(err){toast(err.message,true)}
   };
 });
 $('#tpDate')?.addEventListener('change',e=>{filterDate=e.target.value||today();render()});
 $('#tpMonth')?.addEventListener('change',e=>{month=e.target.value||today().slice(0,7);render()});
 $('#tpTeam')?.addEventListener('change',e=>{selectedTeam=e.target.value;render()});
 $('#tpQuery')?.addEventListener('input',e=>{query=e.target.value;const idx=e.target.selectionStart;render();const el=$('#tpQuery');if(el){el.focus();el.setSelectionRange(idx,idx)}});
}
window.addEventListener('message',ev=>{
 if(ev.origin!==location.origin||ev.source!==window.parent)return;
 const m=ev.data;if(!m||m.source!==SRC)return;
 if(m.type==='snapshot'){
  data=m;filterDate=filterDate||today();month=month||today().slice(0,7);render();
 }else if(m.type==='mutation-result'){
  const p=pending.get(m.requestId);if(!p)return;pending.delete(m.requestId);m.ok?p.resolve():p.reject(new Error(m.error||'Gagal menyimpan'));
 }
});
window.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
if(window.self!==window.top && typeof ResizeObserver==='function'){
  const observer=new ResizeObserver(()=>{
    window.parent.postMessage({source:SRC,type:'resize',height:document.documentElement.scrollHeight},location.origin);
  });
  observer.observe(document.body);
}
send('ready');
})();</script></body></html>
