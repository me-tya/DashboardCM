name: DCM 261114-24 backup and visual system audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dcm-ui-audit-24.yml']
permissions:
  contents: read
jobs:
  backup-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact original repository before modifying UI
        run: |
          git fetch origin refs/heads/backup/261114-DCM-24:refs/remotes/origin/backup/261114-DCM-24
          git archive --format=zip --output=/tmp/261114-DCM-24.zip origin/backup/261114-DCM-24
          unzip -t /tmp/261114-DCM-24.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: 261114-DCM-24
          path: /tmp/261114-DCM-24.zip
          retention-days: 30
      - name: Inspect existing menu, submenu, banner selectors and DOM
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf8')
          css=Path('dcm-guide-header.css').read_text(encoding='utf8')
          lines=s.splitlines()
          print('INDEX TOTAL LINES',len(lines))
          terms=[
            'id="appHeader"','id="tabNav"','class="tabs-row"','id="appMain"',
            'class="page-header','class="hero','class="brand',
            '.tab-btn','.tabs-row','.tab-panel','.page-header',
            '.section-header','.hero','.topbar','.brand',
            'function refreshAll(', 'function switchTab(', 'function renderTab',
            'activeTab', 'function cmRenderTimPusmantap',
            'dcm-guide-header.css','.content{',
          ]
          for p in terms:
           hits=[i for i,line in enumerate(lines) if p.lower() in line.lower()]
           print('\n===',p,'count',len(hits),'first',hits[:25],'===')
           for i in hits[:6]:
            for j in range(max(0,i-2),min(len(lines),i+5)):
             print(str(j+1)+': '+lines[j][:550])
          print('\n=== CSS_OVERRIDES_CURRENT ===')
          for i,line in enumerate(css.splitlines()):
           if any(x in line for x in ['#tabNav','#dcm-activity-view-tabs','#appMain','#appHeader','contextFilterBar']):
            print(i+1,line[:270])
          print('\n=== MAIN DOM TAGS ===')
          for ident in ['appHeader','appMain','tabNav','contextFilterBar']:
           for m in list(re.finditer('id="'+ident+'"',s))[:5]:
            p=s.rfind('<',0,m.start())
            print(ident,'line',s.count('\n',0,m.start())+1,s[p:m.start()+150].split('>')[0][:650])
          print('\n=== CSS HEADINGS IN INDEX ===')
          for p in ['.tabs{','.tab-btn{','.tab-btn.active','.tabs-row','.topbar{','.brand{','.section-header{','.page-header{','.banner{','.hero{']:
           matches=[m.start() for m in re.finditer(re.escape(p),s)]
           print(p,'count',len(matches))
           for i in matches[-3:]:print('  ',s[max(0,i-120):i+470].replace('\n',' ')[:600])
          print('\n=== CONTENT MAIN SUB NAV ===')
          for ident in ['tabNav','contextFilterBar']:
           i=s.find('id="'+ident+'"')
           print('ELEMENT',ident,s[max(0,i-450):i+2600][:3050] if i>=0 else 'NOT FOUND')

          PY

      - name: Inventory per-menu hero/header and nested tab groups
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,collections
          s=Path('index.html').read_text(encoding='utf8')
          lines=s.splitlines()
          print('=== Menu-banner selectors and occurrences ===')
          patterns=['res-hero','kb-hero','contact-hero','priority-hero','survey-hero',
                    'overview-hero','hero-title','cm-tab','subtab','sub-tab','tabs2',
                    'st-tabs','view-tabs','activity-view','section-banner','section-head',
                    'panel-header','panel-head','page-title','tab-title','main-title','activity-header']
          for pattern in patterns:
            hits=[(i+1,x[:320]) for i,x in enumerate(lines) if pattern in x]
            print('SEARCH',pattern,'count',len(hits))
            for i,x in hits[:5]:print('   ',i,x)
          print('=== Top-level per panel content ===')
          for panel in ['analytics','table','tasks','calendar','kanban','matrix','knowledge','contact','resource','survey','priority']:
            for keyword in ['function render'+panel.title(),'function render'+panel.capitalize(),'id="tab-'+panel+'"','function cmRender'+panel.title()]:
              i=s.find(keyword)
              if i>=0:print(panel,'at',s.count('\n',0,i)+1,s[i:i+500].replace('\n',' ')[:500]);break
          print('=== Dynamic nav groups ===')
          rx=re.compile(r'(<(?:nav|div)[^>]*(?:class|id)=["\'][^"\']*(?:tabs|subnav|tabnav)[^"\']*["\'][^>]*>)',re.I)
          candidates=collections.Counter(m.group(1)[:170] for m in rx.finditer(s))
          for k,v in candidates.most_common(24):print(v,k)
          PY
