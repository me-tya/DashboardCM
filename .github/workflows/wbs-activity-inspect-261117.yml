name: Inspect activity integration points for WBS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wbs-activity-inspect-261117.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show activity functions, DOM anchors and data writes
        run: |
          python3 - <<'PY'
          import pathlib
          pats=["agendaForm","function cmAf","function openForm","function openAgenda","function getFiltered","function renderTable","function renderActivity","function renderAgenda","function act","function one","function saveAgenda","function saveAct","agendaForm.addEventListener","state.agendas.push","state.agendas[","S.oneonone.push","S.oneonone.splice","oneonone.filter","getFiltered(","actRows(","actForm(","actModal(","actSave(","actEdit(","actAdd(","renderAct(","actList(","actTable(","filters: {","oneTw","actTahun","function openDetail","data-act=\"act","case 'act","class=\"af-panels","class=\"af-sec","id=\"agendaForm\"","id='agendaForm'","function buildActivity","function submit","agendaForm.onsubmit","form.addEventListener","tambahAktivitas","tab-table","actCh","actFilter","S.oneonone=","oneonone.unshift"]
          for fn in ['index.html','dcm-detail-v2.js','mt-activity-reports.js']:
            p=pathlib.Path(fn)
            if not p.exists(): continue
            s=p.read_text(encoding='utf8',errors='replace');print('###',fn,len(s))
            for term in pats:
              starts=[];i=0
              while 1:
                k=s.lower().find(term.lower(),i)
                if k<0:break
                starts.append(k);i=k+len(term)
              if not starts: continue
              print('KEY',term,'COUNT',len(starts))
              for k in starts[:5]:
                print(' * L',s.count('\n',0,k)+1,repr(s[max(0,k-145):min(len(s),k+390)].replace('\n',' ')))
          PY
