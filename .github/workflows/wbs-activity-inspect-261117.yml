name: Inspect activity integration points for WBS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wbs-activity-inspect-261117.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print integration source ranges
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf8').splitlines()
          for rng in '14028:14098,14565:14605,15094:15173,7392:7419,9485:9557,12430:12462'.split(','):
            a,b=map(int,rng.split(':'))
            print('\n### INDEX',a,b)
            for k in range(a,b+1):
              if k<=len(lines):print(f'{k}: '+lines[k-1][:1250])
          PY
