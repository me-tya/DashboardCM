name: DCM 49 Full Prechange Backup ZIP
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dcm-backup-49.yml']
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive exact prechange repository
        run: |
          git fetch origin refs/heads/backup/261114-DCM-49:refs/remotes/origin/backup/261114-DCM-49
          git archive --format=zip --output=261114-DCM-49.zip origin/backup/261114-DCM-49
          unzip -t 261114-DCM-49.zip | tail -1
          test -s 261114-DCM-49.zip
      - uses: actions/upload-artifact@v4
        with:
          name: 261114-DCM-49
          path: 261114-DCM-49.zip
          retention-days: 90
