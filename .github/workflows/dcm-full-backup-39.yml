name: DCM-39 Prechange Full ZIP Backup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dcm-full-backup-39.yml']
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive immutable pre-change source
        run: |
          git fetch origin refs/heads/backup/261114-DCM-39:refs/remotes/origin/backup/261114-DCM-39
          git archive --format=zip --output=/tmp/261114-DCM-39.zip origin/backup/261114-DCM-39
          unzip -t /tmp/261114-DCM-39.zip | tail -1
          test -s /tmp/261114-DCM-39.zip
      - uses: actions/upload-artifact@v4
        with:
          name: 261114-DCM-39
          path: /tmp/261114-DCM-39.zip
          retention-days: 30
