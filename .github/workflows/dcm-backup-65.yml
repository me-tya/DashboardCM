name: DCM 65 Full Prechange ZIP
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dcm-backup-65.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Archive unchanged DCM snapshot
        run: |
          git fetch origin refs/heads/backup/261116-DCM-65:refs/remotes/origin/backup/261116-DCM-65
          git archive --format=zip --output=261116-DCM-65.zip origin/backup/261116-DCM-65
          unzip -t 261116-DCM-65.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: 261116-DCM-65
          path: 261116-DCM-65.zip
          retention-days: 90
