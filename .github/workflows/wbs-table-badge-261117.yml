name: Show classified WBS in Dashboard CM activity table
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wbs-table-badge-261117.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add compact WBS activity badge and validate
        run: |
          set -eu
          python3 scripts/add-wbs-badge-261117.py
          node --check activity-wbs.js
          git diff --check
      - name: Commit with rebase, never force push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat(dcm): show PM CM WBS stage in activity rows"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
