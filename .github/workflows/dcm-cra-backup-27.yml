name: DCM 27 prechange full ZIP backup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dcm-cra-backup-27.yml'
permissions: {contents: read}
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact prior DCM repository version
        run: |
          git fetch origin refs/heads/backup/261114-DCM-27:refs/remotes/origin/backup/261114-DCM-27
          git archive --format=zip --output=/tmp/261114-DCM-27.zip origin/backup/261114-DCM-27
          unzip -t /tmp/261114-DCM-27.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: 261114-DCM-27
          path: /tmp/261114-DCM-27.zip
          retention-days: 30
