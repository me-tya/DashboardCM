name: DCM 27 CRA and header targeted source audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dcm-cra-audit-27.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print only CRA source snippets and header layout details
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text('utf8')
          lines=s.splitlines()
          patterns=['function renderSurveyHub(', 'function renderSurvey(', 'cm-survey-hero-stat', 'cm-survey-subtabs',
          'cm-survey-subtab','Survei Aktif','Survey Aktif','Total Respons','Riwayat','data-survey-tab',
          'btnSurvey','surveyCount','renderSurveyHub()', 'cm-mini-stat', '.cm-survey-hero',
          'function cmRenderSurvey', '#appHeader.topbar', 'dcm-activity-view-tabs',
          'dcm-header-mt-ghost-26.css']
          for p in patterns:
           all_hits=[i for i,l in enumerate(lines) if p.lower() in l.lower()]
           print('=== PATTERN',p,'count',len(all_hits),'hits', [i+1 for i in all_hits[:12]])
           for i in all_hits[:6]:
            print('LINE',i+1)
            for j in range(max(0,i-3),min(len(lines),i+5)):print(f'{j+1} {lines[j][:1850]}')
          for token in ['function renderSurveyHub(', 'function renderSurvey(', 'function cmRenderSurvey', 'function renderSurveyTab(']:
           i=s.find(token)
           if i>=0:
            print('=== FUNCTION BEGIN',token)
            print(s[i:i+11000])
          print('=== HEAD TAG BOUNDARY')
          for m in list(re.finditer(r'<link rel="stylesheet" href="dcm-[^"]+\.css[^"]*"',s))[-9:]:
           print('STYLE',s[m.start():m.start()+160].replace('\n',' '))
          PY
