name: Release DCM 37 compact Knowledge and Priority
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dcm-knowledge-priority-release-v2-37.yml'
      - 'scripts/dcm_knowledge_priority_37.py'
      - 'tests/dcm-knowledge-priority-37.test.cjs'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate prechange full repository backup
        run: |
          git fetch origin refs/heads/backup/261114-DCM-37:refs/remotes/origin/backup/261114-DCM-37
          git archive --format=zip --output=/tmp/261114-DCM-37.zip origin/backup/261114-DCM-37
          unzip -t /tmp/261114-DCM-37.zip | tail -1
      - name: Apply scoped Priority KPI and Knowledge layout patch
        run: |
          python3 scripts/dcm_knowledge_priority_37.py
      - name: Run KPI and existing Dashboard regression tests
        run: |
          node tests/dcm-knowledge-priority-37.test.cjs
          node tests/dcm-insight-checkbox-36.test.cjs
          node tests/dcm-contact-one-row-35.test.cjs
          node tests/dcm-contact-toolbar-34.test.cjs
          node tests/dcm-primary-nav-justify-33.test.cjs
          node tests/dcm-header-reference-30.test.cjs
          node tests/dcm-header-hover-mt-32.test.cjs
          node tests/dcm-login-photo-31.test.cjs
          node tests/dcm-cra-compact-27.test.cjs
          node tests/dcm-settings-data-actions-smoke.cjs
          node tests/dcm-import-pegawai-smoke.cjs
          node tests/dcm-tim-pusmantap-smoke.cjs
          git diff --check
          git diff --stat
      - name: Publish compact layout and clickable priority cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat(dcm): compact Knowledge/Priority and make 5 project KPI cards clickable"
          git push origin HEAD:main
