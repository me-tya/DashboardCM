name: DCM Backup 261114-DCM-50
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dcm-backup-50.yml']
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive exact pre-update repository
        run: |
          git fetch origin refs/heads/backup/261114-DCM-50:refs/remotes/origin/backup/261114-DCM-50
          git archive --format=zip --output=261114-DCM-50.zip origin/backup/261114-DCM-50
          unzip -t 261114-DCM-50.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: 261114-DCM-50
          path: 261114-DCM-50.zip
          retention-days: 90
