name: DCM 57 Safe Label Change and Prechange Backup
on:
  push:
    branches: [fix/profil-pmo-cmo-unit-57]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build full repository backup from exact unmodified main commit
        run: |
          git fetch origin 1d7c6cf1d9e3586c4d7ef9372fdf9e774c817903
          git archive --format=zip --output=261115-DCM-57.zip 1d7c6cf1d9e3586c4d7ef9372fdf9e774c817903
          unzip -t 261115-DCM-57.zip | tail -1
          test -s 261115-DCM-57.zip
      - uses: actions/upload-artifact@v4
        with:
          name: 261115-DCM-57
          path: 261115-DCM-57.zip
          retention-days: 90
      - name: Validate only display labels change
        run: |
          node --check mt-team-exact/dcm-profile-unit-toolbar-55.js
          node - <<'JS'
          const fs=require('fs'),assert=require('assert/strict');
          const s=fs.readFileSync('mt-team-exact/dcm-profile-unit-toolbar-55.js','utf8');
          assert(s.includes("unitButton.textContent='PMO & CMO Unit'"));
          assert(s.includes("'PMO &amp; CMO UNIT <em>'"));
          assert(s.includes("'PMO & CMO Unit: '"));
          assert(!s.includes('Unit Eselon I'));
          assert(s.includes("const selected=w.MT_T2?._ST?.pum"));
          assert(s.includes("mode==='unit'?st.pu"));
          console.log('PASS: label and count caption changed, original unit selection remains');
          JS
      - name: Regression test for unchanged unit filtering
        run: |
          npm install --no-save --ignore-scripts --no-package-lock --no-audit --no-fund jsdom@25
          node tests/dcm-profile-unit-toolbar-55.test.cjs
          git diff --check
