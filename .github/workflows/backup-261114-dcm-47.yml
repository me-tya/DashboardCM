name: Backup 261114-DCM-47 full repository ZIP
on:
  push:
    branches: [main]
    paths: ['.github/workflows/backup-261114-dcm-47.yml']
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export entire pre-update version
        run: |
          git fetch origin refs/heads/backup/261114-DCM-47:refs/remotes/origin/backup/261114-DCM-47
          git archive --format=zip --output=261114-DCM-47.zip origin/backup/261114-DCM-47
          unzip -t 261114-DCM-47.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: 261114-DCM-47
          path: 261114-DCM-47.zip
          retention-days: 90
